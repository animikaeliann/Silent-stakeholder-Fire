<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Silent Stakeholder — Bluesky Gap Analysis</title>
<style>
  /* ---------------------------------------------------------------------
     Design system: quiet evidence ledger. Cool paper, ink text, one
     structural accent (ledger blue) reused as the confidence sequential
     ramp, three reserved flag colors used only as quiet bordered-tag
     text/border (not solid fills) for the three verdicts. Sentence case
     throughout; mono reserved for anything quantitative or an ID. All
     text/background pairs checked against the WCAG contrast formula
     before shipping -- see commit message for the numbers.
     --------------------------------------------------------------------- */
  :root {
    color-scheme: light;
    --paper:       #eef1f3;
    --ink:         #1b1d22;
    --ink-muted:   #6b6d71;
    --rule:        #c8cacd;
    --ledger:      #1d3f6e;
    --flag-red:    #8c1c13;
    --flag-amber:  #84630f;
    --flag-violet: #5b3568;
    --rubric-1: #14315c;
    --rubric-2: #2c568f;
    --rubric-3: #5a85b8;
    --rubric-4: #a3c0dd;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --paper:       #14161a;
      --ink:         #eceef0;
      --ink-muted:   #a2a4a7;
      --rule:        #3f4144;
      --ledger:      #7fa8d9;
      --flag-red:    #d97467;
      --flag-amber:  #d1ab4d;
      --flag-violet: #b48ec9;
      --rubric-1: #cfe0f2;
      --rubric-2: #9dbfe0;
      --rubric-3: #6f97c4;
      --rubric-4: #445f8a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:       #14161a;
    --ink:         #eceef0;
    --ink-muted:   #a2a4a7;
    --rule:        #3f4144;
    --ledger:      #7fa8d9;
    --flag-red:    #d97467;
    --flag-amber:  #d1ab4d;
    --flag-violet: #b48ec9;
    --rubric-1: #cfe0f2;
    --rubric-2: #9dbfe0;
    --rubric-3: #6f97c4;
    --rubric-4: #445f8a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.55;
    padding: 40px 24px 96px;
    max-width: 920px;
    margin: 0 auto;
  }

  :focus-visible { outline: 2px solid var(--ledger); outline-offset: 2px; border-radius: 2px; }

  @media (prefers-reduced-motion: no-preference) {
    .gap-card, a, summary { transition: border-color 120ms ease, background-color 120ms ease; }
  }

  /* Masthead -- ruled letterhead, no gradient/hero */
  header { margin-bottom: 8px; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
  header::after { content: ""; display: block; height: 1px; background: var(--rule); margin-top: 6px; }
  h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    font-size: 27px; font-weight: 600; margin: 0 0 10px; letter-spacing: -0.005em;
  }
  .subtitle { color: var(--ink-muted); font-size: 15px; max-width: 68ch; line-height: 1.5; }
  .status-line {
    margin-top: 16px; font-size: 12.5px; color: var(--ink-muted);
    display: flex; align-items: center; gap: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--ink-muted); flex-shrink: 0; }
  .dot.ok  { background: var(--ledger); }
  .dot.err { background: var(--flag-red); }

  section h2 {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; letter-spacing: 0.02em;
    color: var(--ink-muted); margin: 44px 0 18px; font-weight: 600;
    padding-bottom: 8px; border-bottom: 0.5px solid var(--rule);
  }

  /* Gap card -- quiet: thin border, soft radius, generous padding, no shadow */
  .gap-card {
    background: var(--paper);
    border: 0.5px solid var(--rule);
    border-radius: 12px;
    padding: 28px 30px;
    margin-bottom: 24px;
  }

  .gap-header { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
  .gap-id {
    flex-shrink: 0; padding-top: 3px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; font-weight: 600; color: var(--ledger); letter-spacing: 0.02em;
  }
  .need {
    flex: 1 1 260px; margin: 0;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    font-size: 19px; font-weight: 500; line-height: 1.42; color: var(--ink);
  }

  /* Verdict: quiet bordered tag, plain colored text -- not a bold filled pill */
  .verdict-tag {
    display: inline-flex; align-items: center; flex-shrink: 0;
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.01em;
    padding: 4px 11px; border-radius: 6px; white-space: nowrap;
    background: transparent; border: 0.5px solid currentColor;
  }
  .verdict-IGNORED           { color: var(--flag-red); }
  .verdict-UNDER-PRIORITIZED { color: var(--flag-amber); }
  .verdict-MISUNDERSTOOD     { color: var(--flag-violet); }

  /* Confidence: the big figure + the rubric-math signature bar */
  .confidence-row {
    display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap;
    padding: 4px 0 18px; border-bottom: 0.5px solid var(--rule); margin-bottom: 16px;
  }
  .confidence-figure {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 38px; font-weight: 700; color: var(--ink); line-height: 1;
    min-width: 92px;
  }
  .confidence-figure .cf-max { font-size: 15px; color: var(--ink-muted); font-weight: 500; }

  .rubric-wrap { flex: 1; min-width: 220px; }
  .rubric-bar { display: flex; height: 14px; border: 0.5px solid var(--rule); border-radius: 3px; overflow: hidden; }
  .rubric-seg { height: 100%; }
  .rubric-seg + .rubric-seg { border-left: 1px solid var(--paper); }
  .rubric-ticks { display: flex; justify-content: space-between; margin-top: 3px; }
  .rubric-ticks span { width: 1px; height: 5px; background: var(--rule); display: block; }
  .rubric-legend {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; color: var(--ink-muted);
  }
  .rubric-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

  /* Team badge + quiet inline metadata -- metadata must not compete with the badge */
  .meta-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; margin: 0 0 20px;
  }
  .team-badge {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: 12.5px; font-weight: 600;
    padding: 3px 10px; border-radius: 6px; white-space: nowrap;
    border: 0.5px solid var(--ledger); color: var(--ledger); background: transparent;
  }
  .team-badge.team-unavailable { border-color: var(--rule); color: var(--ink-muted); }
  .team-cc { font-size: 12.5px; color: var(--ink-muted); }
  .quiet-meta {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: var(--ink-muted);
  }
  .muted-note { color: var(--ink-muted); font-style: italic; font-size: 14px; }

  /* Expandable "proof" sections */
  details { border-top: 0.5px solid var(--rule); }
  summary {
    cursor: pointer; padding: 10px 0; user-select: none; list-style: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; font-weight: 600; color: var(--ledger); letter-spacing: 0.01em;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  summary:hover { text-decoration: underline; }
  .detail-body { padding: 4px 0 16px; }

  .block-label {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; letter-spacing: 0.02em;
    color: var(--ink-muted); margin: 18px 0 8px; font-weight: 700;
  }
  .block-label:first-child { margin-top: 0; }

  .math-block {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; line-height: 1.65; color: var(--ink);
    border: 0.5px solid var(--rule); border-radius: 6px;
    padding: 12px 14px; white-space: pre-wrap; word-break: break-word;
  }

  /* Evidence & roadmap refs: clean two-column rows, no bullets, no nested cards */
  .evidence-row, .ref-row {
    display: flex; gap: 16px; padding: 12px 0; border-top: 0.5px solid var(--rule);
  }
  .evidence-row:first-child, .ref-row:first-child { border-top: none; }
  .ev-id-col, .ref-id-col {
    flex: 0 0 150px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
  }
  .ev-id-col a, .ref-id-col a { color: var(--ledger); }
  .ev-weight { display: block; font-family: system-ui, sans-serif; font-size: 11px; color: var(--ink-muted); margin-top: 3px; }
  .ev-excerpt { flex: 1; font-style: italic; color: var(--ink); font-size: 14.5px; line-height: 1.5; }
  .ref-relation { flex: 1; color: var(--ink); font-size: 14px; line-height: 1.5; }
  .plain-text { color: var(--ink); font-size: 14.5px; line-height: 1.5; }

  a.ev-link { color: var(--ledger); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 2px; }
  a.ev-link:hover { text-decoration-color: currentColor; }

  .alt-explanation { font-size: 14px; color: var(--ink-muted); font-style: italic; margin-top: 4px; line-height: 1.5; }

  /* Rejected candidates -- muted/deprioritized, same card language, quieter still */
  .rejected-card {
    border: 0.5px solid var(--rule); border-radius: 12px;
    padding: 22px 26px; margin-bottom: 16px;
  }
  .ruled-out-tag {
    display: inline-block; margin-bottom: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px; letter-spacing: 0.03em;
    color: var(--ink-muted); border: 0.5px solid var(--rule); padding: 2px 8px; border-radius: 5px;
  }
  .rejected-card h3 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    font-size: 16px; font-weight: 500; margin: 0 0 8px; color: var(--ink-muted);
  }
  .rejected-reason { font-size: 14px; color: var(--ink-muted); line-height: 1.5; }
  .rejected-ids { margin-top: 8px; font-size: 11.5px; color: var(--ink-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .error-banner {
    border: 0.5px solid var(--flag-red); border-radius: 8px;
    color: var(--ink); padding: 14px 18px; font-size: 14px; margin-bottom: 20px;
  }
  .error-banner code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--rule); padding: 1px 5px; border-radius: 4px;
  }
  .loading { color: var(--ink-muted); font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  @media (max-width: 560px) {
    body { font-size: 16px; padding: 24px 16px 72px; }
    h1 { font-size: 22px; }
    .confidence-figure { font-size: 30px; min-width: 0; }
    .need { font-size: 18px; }
    .gap-card { padding: 20px 18px; }
    .evidence-row, .ref-row { flex-direction: column; gap: 4px; }
    .ev-id-col, .ref-id-col { flex: none; }
  }
</style>
</head>
<body>

<header>
  <h1>The Silent Stakeholder — Bluesky Gap Analysis</h1>
  <div class="subtitle">8,359 Google Play reviews cross-checked against the live bluesky-social/social-app GitHub issue tracker. Ranked strongest evidence first.</div>
  <div class="status-line"><span class="dot" id="status-dot"></span><span id="status-text">Checking API…</span></div>
</header>

<div id="error-slot"></div>

<section>
  <h2>Gaps</h2>
  <div id="gaps-list"><div class="loading">Loading…</div></div>
</section>

<section>
  <h2>Rejected candidates — falsification log</h2>
  <div id="rejected-list"><div class="loading">Loading…</div></div>
</section>

<script>
// file:// (double-click workflow): no same origin to talk to, so hit the absolute
// dev-server URL directly, same as before. Not port 8000: Docker Desktop's backend
// service is bound to [::]:8000 (dual-stack) and silently swallows loopback traffic
// on that port whenever nothing else holds the specific IPv4 address -- 8420 avoids
// the whole class of collision. Any other origin (e.g. served through Docker/nginx/
// same-origin deployment) uses a relative path instead -- no CORS needed there.
const API_BASE = window.location.protocol === "file:" ? "http://127.0.0.1:8420" : "";
const REPO_URL = "https://github.com/bluesky-social/social-app";

// The four rubric weights are fixed by SPEC.md's formula; the per-gap
// contribution VALUES (factor * weight), review count, and complaint span
// are all parsed out of the already-fetched confidence_justification string
// below, purely for rendering -- no new fetch, no change to what data the
// API returns.
const RUBRIC_FACTORS = [
  { key: "corroboration",            label: "corrob", css: "--rubric-1" },
  { key: "signal_count",             label: "sig",    css: "--rubric-2" },
  { key: "latency",                  label: "lat",    css: "--rubric-3" },
  { key: "roadmap_disconfirmation",  label: "disc",   css: "--rubric-4" },
];

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function toSentenceCase(s) {
  const lower = String(s).toLowerCase();
  return lower.charAt(0).toUpperCase() + lower.slice(1);
}

function evidenceLink(id) {
  const m = id.match(/^github-issue-(\d+)$/);
  if (m) return `${REPO_URL}/issues/${m[1]}`;
  const ms = id.match(/^github-milestone-(\d+)$/);
  if (ms) return `${REPO_URL}/milestone/${ms[1]}`;
  return null;
}

function parseRubricContributions(justification) {
  return RUBRIC_FACTORS.map(f => {
    const re = new RegExp(f.key + "=\\d+\\.?\\d*.*?\\*\\s*[\\d.]+\\s*=\\s*(\\d+\\.?\\d*)");
    const m = justification.match(re);
    return { ...f, value: m ? parseFloat(m[1]) : 0 };
  });
}

function renderRubricBar(justification) {
  const contributions = parseRubricContributions(justification);
  const segments = contributions.map(c =>
    `<div class="rubric-seg" style="width:${(c.value * 100).toFixed(1)}%;background:var(${c.css})"></div>`
  ).join("");
  const legend = contributions.map(c =>
    `<span><i style="background:var(${c.css})"></i>${escapeHtml(c.label)} ${c.value.toFixed(2)}</span>`
  ).join("");
  return `
    <div class="rubric-wrap">
      <div class="rubric-bar" aria-hidden="true">${segments}</div>
      <div class="rubric-ticks" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="rubric-legend">${legend}</div>
    </div>`;
}

function parseReviewCount(justification) {
  const m = justification.match(/n=(\d+) distinct reviews/);
  return m ? parseInt(m[1], 10) : null;
}

function parseSpanDays(justification) {
  const m = justification.match(/span=(\d+)d/);
  return m ? parseInt(m[1], 10) : null;
}

function renderQuietMeta(gap) {
  const n = parseReviewCount(gap.confidence_justification);
  const span = parseSpanDays(gap.confidence_justification);
  const refs = gap.roadmap_refs || [];
  const issueMatch = refs.length ? refs[0].id.match(/^github-issue-(\d+)$/) : null;

  const parts = [];
  if (n !== null) parts.push(`${n} reports`);
  if (span !== null) parts.push(`${span}d span`);
  if (issueMatch) parts.push(`#${issueMatch[1]}${refs.length > 1 ? ` +${refs.length - 1}` : ""}`);
  return parts.length ? `<span class="quiet-meta">${escapeHtml(parts.join(" · "))}</span>` : "";
}

function renderEvidence(evidence) {
  return evidence.map(e => {
    const link = evidenceLink(e.id);
    const idHtml = link
      ? `<a class="ev-link" href="${link}" target="_blank" rel="noopener">${escapeHtml(e.id)}</a>`
      : escapeHtml(e.id);
    return `
      <div class="evidence-row">
        <div class="ev-id-col">${idHtml}<span class="ev-weight">${escapeHtml(e.weight)}</span></div>
        <div class="ev-excerpt">“${escapeHtml(e.excerpt_or_paraphrase)}”</div>
      </div>`;
  }).join("");
}

function renderRefs(refs) {
  return refs.map(r => {
    const link = evidenceLink(r.id);
    const idHtml = link
      ? `<a class="ev-link" href="${link}" target="_blank" rel="noopener">${escapeHtml(r.id)}</a>`
      : escapeHtml(r.id);
    return `
      <div class="ref-row">
        <div class="ref-id-col">${idHtml}</div>
        <div class="ref-relation">${escapeHtml(r.relation)}</div>
      </div>`;
  }).join("");
}

function renderTeamBadge(routing) {
  if (!routing) {
    return `<span class="team-badge team-unavailable">team routing: not available</span>`;
  }
  const ccHtml = (routing.cc_teams && routing.cc_teams.length)
    ? ` <span class="team-cc">(cc: ${routing.cc_teams.map(escapeHtml).join(", ")})</span>`
    : "";
  return `<span class="team-badge">&rarr; ${escapeHtml(routing.team)}</span>${ccHtml}`;
}

function renderNotificationSection(notif) {
  if (!notif) {
    return `
      <details>
        <summary>Drafted notification</summary>
        <div class="detail-body">
          <div class="muted-note">Drafted notification not available for this gap.</div>
        </div>
      </details>`;
  }
  return `
    <details>
      <summary>Drafted notification</summary>
      <div class="detail-body">
        <div class="block-label">Subject</div>
        <div class="plain-text">${escapeHtml(notif.subject)}</div>
        <div class="block-label">Draft</div>
        <div class="math-block">${escapeHtml(notif.body_text)}</div>
      </div>
    </details>`;
}

function renderGap(gap) {
  const rankPadded = String(gap.rank).padStart(2, "0");
  return `
    <article class="gap-card" id="gap-${gap.rank}">
      <div class="gap-header">
        <span class="gap-id">GAP-${rankPadded}</span>
        <h3 class="need">${escapeHtml(gap.need)}</h3>
        <span class="verdict-tag verdict-${escapeHtml(gap.verdict)}">${escapeHtml(toSentenceCase(gap.verdict))}</span>
      </div>

      <div class="confidence-row">
        <div class="confidence-figure">${gap.confidence.toFixed(2)}<span class="cf-max">/1.00</span></div>
        ${renderRubricBar(gap.confidence_justification)}
      </div>

      <div class="meta-row">
        ${renderTeamBadge(gap._routing)}
        ${renderQuietMeta(gap)}
      </div>

      <details>
        <summary>Evidence &amp; rubric math — ${gap.evidence.length} sources</summary>
        <div class="detail-body">
          <div class="block-label">Verdict basis</div>
          <div class="plain-text">${escapeHtml(gap.verdict_justification)}</div>

          <div class="block-label">Confidence math (full working)</div>
          <div class="math-block">${escapeHtml(gap.confidence_justification)}</div>

          <div class="block-label">Evidence</div>
          ${renderEvidence(gap.evidence)}

          <div class="block-label">Roadmap cross-references</div>
          ${renderRefs(gap.roadmap_refs)}

          <div class="block-label">Alternative explanations considered and rejected</div>
          <div class="alt-explanation">${escapeHtml(gap.rejected_alternative_explanations)}</div>
        </div>
      </details>
      ${renderNotificationSection(gap._notification)}
    </article>`;
}

function renderRejected(rec) {
  const ids = (rec.supporting_evidence_ids || []).join(", ");
  return `
    <div class="rejected-card">
      <span class="ruled-out-tag">Ruled out</span>
      <h3>${escapeHtml(rec.need)}</h3>
      <div class="rejected-reason">${escapeHtml(rec.reason)}</div>
      ${ids ? `<div class="rejected-ids">evidence: ${escapeHtml(ids)}</div>` : ""}
    </div>`;
}

async function main() {
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  const errorSlot = document.getElementById("error-slot");

  try {
    const health = await fetch(`${API_BASE}/health`).then(r => r.json());
    statusDot.classList.add("ok");
    statusText.textContent = `API online — ${health.gaps_loaded} gaps, ${health.rejected_loaded} rejected candidates loaded`;
  } catch (e) {
    statusDot.classList.add("err");
    statusText.textContent = "API unreachable";
    errorSlot.innerHTML = `<div class="error-banner">Can't reach the API at ${API_BASE}. Start it with:
      <code>python -m uvicorn backend.app:app --reload --port 8420</code></div>`;
    document.getElementById("gaps-list").innerHTML = "";
    document.getElementById("rejected-list").innerHTML = "";
    return;
  }

  try {
    const gaps = await fetch(`${API_BASE}/gaps`).then(r => r.json());

    let routingByRank = {};
    try {
      const routing = await fetch(`${API_BASE}/routing`).then(r => r.json());
      routingByRank = Object.fromEntries(routing.map(r => [r.gap_rank, r]));
    } catch (e) {
      // /routing unavailable -- each card falls back to "not available" below
    }

    await Promise.all(gaps.map(async gap => {
      gap._routing = routingByRank[gap.rank] || null;
      try {
        const resp = await fetch(`${API_BASE}/notifications/${gap.rank}`);
        gap._notification = resp.ok ? await resp.json() : null;
      } catch (e) {
        gap._notification = null;
      }
    }));

    document.getElementById("gaps-list").innerHTML = gaps.map(renderGap).join("");
  } catch (e) {
    document.getElementById("gaps-list").innerHTML = `<div class="error-banner">Failed to load /gaps: ${escapeHtml(e.message)}</div>`;
  }

  try {
    const rejected = await fetch(`${API_BASE}/rejected`).then(r => r.json());
    document.getElementById("rejected-list").innerHTML = rejected.map(renderRejected).join("");
  } catch (e) {
    document.getElementById("rejected-list").innerHTML = `<div class="error-banner">Failed to load /rejected: ${escapeHtml(e.message)}</div>`;
  }
}

main();
</script>
</body>
</html>
