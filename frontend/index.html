<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Silent Stakeholder — Bluesky Gap Analysis</title>
<style>
  /* ---------------------------------------------------------------------
     Design system: "case file / evidence ledger." Cool paper, ink text,
     one structural accent (ledger blue) reused as the confidence sequential
     ramp, three reserved flag colors for the three verdicts. All pairs
     below were checked against WCAG contrast formulas before shipping,
     not eyeballed -- see commit message for the numbers.
     --------------------------------------------------------------------- */
  :root {
    color-scheme: light;
    --paper:       #eef1f3;
    --ink:         #1b1d22;
    --ink-muted:   #6b6d71;
    --rule:        #c8cacd;
    --ledger:      #1d3f6e;
    --flag-red:    #8c1c13;
    --flag-amber:  #8a6a12;
    --flag-violet: #5b3568;
    --tag-text:    #ffffff;
    --rubric-1: #14315c;
    --rubric-2: #2c568f;
    --rubric-3: #5a85b8;
    --rubric-4: #a3c0dd;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --paper:       #14161a;
      --ink:         #eceef0;
      --ink-muted:   #a2a4a7;
      --rule:        #3f4144;
      --ledger:      #7fa8d9;
      --flag-red:    #d97467;
      --flag-amber:  #d1ab4d;
      --flag-violet: #b48ec9;
      --tag-text:    #0b0c0e;
      --rubric-1: #cfe0f2;
      --rubric-2: #9dbfe0;
      --rubric-3: #6f97c4;
      --rubric-4: #445f8a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper:       #14161a;
    --ink:         #eceef0;
    --ink-muted:   #a2a4a7;
    --rule:        #3f4144;
    --ledger:      #7fa8d9;
    --flag-red:    #d97467;
    --flag-amber:  #d1ab4d;
    --flag-violet: #b48ec9;
    --tag-text:    #0b0c0e;
    --rubric-1: #cfe0f2;
    --rubric-2: #9dbfe0;
    --rubric-3: #6f97c4;
    --rubric-4: #445f8a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.55;
    padding: 40px 24px 96px;
    max-width: 920px;
    margin: 0 auto;
  }

  :focus-visible { outline: 2px solid var(--ledger); outline-offset: 2px; border-radius: 2px; }

  @media (prefers-reduced-motion: no-preference) {
    .gap-card, a, summary { transition: border-color 120ms ease, background-color 120ms ease; }
  }

  /* Masthead -- ruled letterhead, no gradient/hero */
  header { margin-bottom: 8px; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
  header::after { content: ""; display: block; height: 1px; background: var(--rule); margin-top: 6px; }
  h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    font-size: 27px; font-weight: 600; margin: 0 0 10px; letter-spacing: -0.005em;
  }
  .subtitle { color: var(--ink-muted); font-size: 15px; max-width: 68ch; line-height: 1.5; }
  .status-line {
    margin-top: 16px; font-size: 12.5px; color: var(--ink-muted);
    display: flex; align-items: center; gap: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--ink-muted); flex-shrink: 0; }
  .dot.ok  { background: var(--ledger); }
  .dot.err { background: var(--flag-red); }

  section h2 {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-muted); margin: 44px 0 18px; font-weight: 600;
    padding-bottom: 8px; border-bottom: 1px solid var(--rule);
  }

  /* Gap card -- flat, ruled "docket," no drop shadows */
  .gap-card {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--ink);
    padding: 22px 24px;
    margin-bottom: 24px;
  }

  .docket-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 16px; }
  .rank {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 15px; font-weight: 700; color: var(--ledger); letter-spacing: 0.02em;
  }

  .verdict-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 4px 10px; border-radius: 3px; color: var(--tag-text); white-space: nowrap;
  }
  .verdict-tag .tag-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.85; }
  .verdict-IGNORED           { background: var(--flag-red); }
  .verdict-UNDER-PRIORITIZED { background: var(--flag-amber); }
  .verdict-MISUNDERSTOOD     { background: var(--flag-violet); }

  .team-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
    padding: 4px 10px; border-radius: 3px; white-space: nowrap;
    border: 1px solid var(--ledger); color: var(--ledger); background: transparent;
  }
  .team-badge.team-unavailable { border-color: var(--rule); color: var(--ink-muted); }
  .team-cc { font-size: 12px; color: var(--ink-muted); }
  .muted-note { color: var(--ink-muted); font-style: italic; font-size: 14px; }

  /* Confidence: the big figure + the rubric-math signature bar */
  .confidence-row {
    display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap;
    padding: 14px 0 18px; border-bottom: 1px solid var(--rule); margin-bottom: 18px;
  }
  .confidence-figure {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 38px; font-weight: 700; color: var(--ink); line-height: 1;
    min-width: 92px;
  }
  .confidence-figure .cf-max { font-size: 15px; color: var(--ink-muted); font-weight: 500; }

  .rubric-wrap { flex: 1; min-width: 220px; }
  .rubric-bar { display: flex; height: 14px; border: 1px solid var(--rule); overflow: hidden; }
  .rubric-seg { height: 100%; }
  .rubric-seg + .rubric-seg { border-left: 1px solid var(--paper); }
  .rubric-ticks { display: flex; justify-content: space-between; margin-top: 3px; }
  .rubric-ticks span { width: 1px; height: 5px; background: var(--rule); display: block; }
  .rubric-legend {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; color: var(--ink-muted);
  }
  .rubric-legend i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: middle; }

  .need {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    font-size: 20px; font-weight: 500; line-height: 1.42;
    margin: 0 0 18px; color: var(--ink);
  }

  /* Expandable "proof" sections */
  details { border-top: 1px solid var(--rule); }
  summary {
    cursor: pointer; padding: 10px 0; user-select: none; list-style: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; font-weight: 600; color: var(--ledger);
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  summary:hover { text-decoration: underline; }
  .detail-body { padding: 4px 0 16px; }

  .block-label {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-muted); margin: 18px 0 8px; font-weight: 700;
  }
  .block-label:first-child { margin-top: 0; }

  .math-block {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; line-height: 1.65; color: var(--ink);
    border: 1px solid var(--rule); border-left: 2px solid var(--ledger);
    padding: 12px 14px; white-space: pre-wrap; word-break: break-word;
  }

  .evidence-item { padding: 12px 0; border-top: 1px solid var(--rule); }
  .evidence-item:first-child { border-top: none; }
  .exhibit-label {
    display: block; margin-bottom: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-muted);
  }
  .ev-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--ledger); }
  .weight-badge {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 1px 6px; margin-right: 8px; border: 1px solid var(--rule); color: var(--ink-muted);
  }
  .weight-primary { border-color: var(--ledger); color: var(--ledger); }
  .ev-text { color: var(--ink); margin-top: 4px; font-size: 14.5px; line-height: 1.5; }

  .ref-item { padding: 10px 0; border-top: 1px solid var(--rule); font-size: 14px; color: var(--ink); }
  .ref-item:first-child { border-top: none; }

  a.ev-link { color: var(--ledger); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 2px; }
  a.ev-link:hover { text-decoration-color: currentColor; }

  .alt-explanation { font-size: 14px; color: var(--ink-muted); font-style: italic; margin-top: 4px; line-height: 1.5; }

  /* Rejected candidates -- visually distinct "ruled out," not a 4th verdict color */
  .rejected-card {
    border: 1px solid var(--rule); border-left: 3px solid var(--ink-muted);
    padding: 16px 20px; margin-bottom: 16px;
  }
  .ruled-out-tag {
    display: inline-block; margin-bottom: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--ink-muted); border: 1px solid var(--rule); padding: 2px 8px; border-radius: 2px;
  }
  .rejected-card h3 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    font-size: 16px; font-weight: 500; margin: 0 0 8px; color: var(--ink);
  }
  .rejected-reason { font-size: 14px; color: var(--ink-muted); line-height: 1.5; }
  .rejected-ids { margin-top: 8px; font-size: 11.5px; color: var(--ink-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .error-banner {
    border: 1px solid var(--flag-red); border-left: 3px solid var(--flag-red);
    color: var(--ink); padding: 14px 18px; font-size: 14px; margin-bottom: 20px;
  }
  .error-banner code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--rule); padding: 1px 5px; border-radius: 2px;
  }
  .loading { color: var(--ink-muted); font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  @media (max-width: 560px) {
    body { font-size: 16px; padding: 24px 16px 72px; }
    h1 { font-size: 22px; }
    .confidence-figure { font-size: 30px; min-width: 0; }
    .need { font-size: 18px; }
    .docket-row { gap: 8px 10px; }
    .gap-card { padding: 18px 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>The Silent Stakeholder — Bluesky Gap Analysis</h1>
  <div class="subtitle">8,359 Google Play reviews cross-checked against the live bluesky-social/social-app GitHub issue tracker. Ranked strongest evidence first.</div>
  <div class="status-line"><span class="dot" id="status-dot"></span><span id="status-text">Checking API…</span></div>
</header>

<div id="error-slot"></div>

<section>
  <h2>Gaps</h2>
  <div id="gaps-list"><div class="loading">Loading…</div></div>
</section>

<section>
  <h2>Rejected candidates — falsification log</h2>
  <div id="rejected-list"><div class="loading">Loading…</div></div>
</section>

<script>
const API_BASE = "http://127.0.0.1:8420"; // not port 8000: Docker Desktop's backend service is
// bound to [::]:8000 (dual-stack), and silently swallows loopback traffic on that port whenever
// nothing else holds the specific IPv4 address -- 8420 avoids the whole class of collision
const REPO_URL = "https://github.com/bluesky-social/social-app";

// The four rubric weights are fixed by SPEC.md's formula; the per-gap
// contribution VALUES (factor * weight) are parsed out of the already-
// fetched confidence_justification string below, purely for rendering --
// no new fetch, no change to what data the API returns.
const RUBRIC_FACTORS = [
  { key: "corroboration",            label: "corrob", css: "--rubric-1" },
  { key: "signal_count",             label: "sig",    css: "--rubric-2" },
  { key: "latency",                  label: "lat",    css: "--rubric-3" },
  { key: "roadmap_disconfirmation",  label: "disc",   css: "--rubric-4" },
];

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function evidenceLink(id) {
  const m = id.match(/^github-issue-(\d+)$/);
  if (m) return `${REPO_URL}/issues/${m[1]}`;
  const ms = id.match(/^github-milestone-(\d+)$/);
  if (ms) return `${REPO_URL}/milestone/${ms[1]}`;
  return null;
}

function parseRubricContributions(justification) {
  return RUBRIC_FACTORS.map(f => {
    const re = new RegExp(f.key + "=\\d+\\.?\\d*.*?\\*\\s*[\\d.]+\\s*=\\s*(\\d+\\.?\\d*)");
    const m = justification.match(re);
    return { ...f, value: m ? parseFloat(m[1]) : 0 };
  });
}

function renderRubricBar(justification) {
  const contributions = parseRubricContributions(justification);
  const segments = contributions.map(c =>
    `<div class="rubric-seg" style="width:${(c.value * 100).toFixed(1)}%;background:var(${c.css})"></div>`
  ).join("");
  const legend = contributions.map(c =>
    `<span><i style="background:var(${c.css})"></i>${escapeHtml(c.label)} ${c.value.toFixed(2)}</span>`
  ).join("");
  return `
    <div class="rubric-wrap">
      <div class="rubric-bar" aria-hidden="true">${segments}</div>
      <div class="rubric-ticks" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="rubric-legend">${legend}</div>
    </div>`;
}

function renderEvidence(evidence) {
  return evidence.map((e, i) => {
    const link = evidenceLink(e.id);
    const idHtml = link
      ? `<a class="ev-link" href="${link}" target="_blank" rel="noopener">${escapeHtml(e.id)}</a>`
      : `<span class="ev-id">${escapeHtml(e.id)}</span>`;
    const weightClass = e.weight === "primary" ? "weight-primary" : "";
    const exhibitLetter = String.fromCharCode(65 + i);
    return `
      <div class="evidence-item">
        <span class="exhibit-label">Exhibit ${exhibitLetter}</span>
        <span class="weight-badge ${weightClass}">${escapeHtml(e.weight)}</span>${idHtml}
        <div class="ev-text">${escapeHtml(e.excerpt_or_paraphrase)}</div>
      </div>`;
  }).join("");
}

function renderRefs(refs) {
  return refs.map(r => {
    const link = evidenceLink(r.id);
    const idHtml = link
      ? `<a class="ev-link" href="${link}" target="_blank" rel="noopener">${escapeHtml(r.id)}</a>`
      : `<span class="ev-id">${escapeHtml(r.id)}</span>`;
    return `<div class="ref-item">${idHtml} — ${escapeHtml(r.relation)}</div>`;
  }).join("");
}

function renderTeamBadge(routing) {
  if (!routing) {
    return `<span class="team-badge team-unavailable">team routing: not available</span>`;
  }
  const ccHtml = (routing.cc_teams && routing.cc_teams.length)
    ? ` <span class="team-cc">(cc: ${routing.cc_teams.map(escapeHtml).join(", ")})</span>`
    : "";
  return `<span class="team-badge">&rarr; ${escapeHtml(routing.team)}</span>${ccHtml}`;
}

function renderNotificationSection(notif) {
  if (!notif) {
    return `
      <details>
        <summary>Drafted notification</summary>
        <div class="detail-body">
          <div class="muted-note">Drafted notification not available for this gap.</div>
        </div>
      </details>`;
  }
  return `
    <details>
      <summary>Drafted notification</summary>
      <div class="detail-body">
        <div class="block-label">Subject</div>
        <div class="ev-text">${escapeHtml(notif.subject)}</div>
        <div class="block-label">Draft</div>
        <div class="math-block">${escapeHtml(notif.body_text)}</div>
      </div>
    </details>`;
}

function renderGap(gap) {
  const rankPadded = String(gap.rank).padStart(2, "0");
  return `
    <article class="gap-card" id="gap-${gap.rank}">
      <div class="docket-row">
        <span class="rank">N&deg; ${rankPadded}</span>
        <span class="verdict-tag verdict-${escapeHtml(gap.verdict)}"><span class="tag-dot"></span>${escapeHtml(gap.verdict)}</span>
        ${renderTeamBadge(gap._routing)}
      </div>
      <div class="confidence-row">
        <div class="confidence-figure">${gap.confidence.toFixed(2)}<span class="cf-max">/1.00</span></div>
        ${renderRubricBar(gap.confidence_justification)}
      </div>
      <h3 class="need">${escapeHtml(gap.need)}</h3>
      <details>
        <summary>Evidence &amp; rubric math — ${gap.evidence.length} exhibits</summary>
        <div class="detail-body">
          <div class="block-label">Verdict basis</div>
          <div class="ev-text">${escapeHtml(gap.verdict_justification)}</div>

          <div class="block-label">Confidence math (full working)</div>
          <div class="math-block">${escapeHtml(gap.confidence_justification)}</div>

          <div class="block-label">Evidence</div>
          ${renderEvidence(gap.evidence)}

          <div class="block-label">Roadmap cross-references</div>
          ${renderRefs(gap.roadmap_refs)}

          <div class="block-label">Alternative explanations considered and rejected</div>
          <div class="alt-explanation">${escapeHtml(gap.rejected_alternative_explanations)}</div>
        </div>
      </details>
      ${renderNotificationSection(gap._notification)}
    </article>`;
}

function renderRejected(rec) {
  const ids = (rec.supporting_evidence_ids || []).join(", ");
  return `
    <div class="rejected-card">
      <span class="ruled-out-tag">Ruled out</span>
      <h3>${escapeHtml(rec.need)}</h3>
      <div class="rejected-reason">${escapeHtml(rec.reason)}</div>
      ${ids ? `<div class="rejected-ids">evidence: ${escapeHtml(ids)}</div>` : ""}
    </div>`;
}

async function main() {
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  const errorSlot = document.getElementById("error-slot");

  try {
    const health = await fetch(`${API_BASE}/health`).then(r => r.json());
    statusDot.classList.add("ok");
    statusText.textContent = `API online — ${health.gaps_loaded} gaps, ${health.rejected_loaded} rejected candidates loaded`;
  } catch (e) {
    statusDot.classList.add("err");
    statusText.textContent = "API unreachable";
    errorSlot.innerHTML = `<div class="error-banner">Can't reach the API at ${API_BASE}. Start it with:
      <code>python -m uvicorn backend.app:app --reload --port 8420</code></div>`;
    document.getElementById("gaps-list").innerHTML = "";
    document.getElementById("rejected-list").innerHTML = "";
    return;
  }

  try {
    const gaps = await fetch(`${API_BASE}/gaps`).then(r => r.json());

    let routingByRank = {};
    try {
      const routing = await fetch(`${API_BASE}/routing`).then(r => r.json());
      routingByRank = Object.fromEntries(routing.map(r => [r.gap_rank, r]));
    } catch (e) {
      // /routing unavailable -- each card falls back to "not available" below
    }

    await Promise.all(gaps.map(async gap => {
      gap._routing = routingByRank[gap.rank] || null;
      try {
        const resp = await fetch(`${API_BASE}/notifications/${gap.rank}`);
        gap._notification = resp.ok ? await resp.json() : null;
      } catch (e) {
        gap._notification = null;
      }
    }));

    document.getElementById("gaps-list").innerHTML = gaps.map(renderGap).join("");
  } catch (e) {
    document.getElementById("gaps-list").innerHTML = `<div class="error-banner">Failed to load /gaps: ${escapeHtml(e.message)}</div>`;
  }

  try {
    const rejected = await fetch(`${API_BASE}/rejected`).then(r => r.json());
    document.getElementById("rejected-list").innerHTML = rejected.map(renderRejected).join("");
  } catch (e) {
    document.getElementById("rejected-list").innerHTML = `<div class="error-banner">Failed to load /rejected: ${escapeHtml(e.message)}</div>`;
  }
}

main();
</script>
</body>
</html>
