<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Silent Stakeholder — Bluesky Gap Analysis</title>
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface:        #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --seq-100: #cde2fb; --seq-250: #86b6ef; --seq-450: #2a78d6; --seq-650: #104281;
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-serious:  #ec835a;
    --status-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface:        #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --seq-100: #cde2fb; --seq-250: #86b6ef; --seq-450: #3987e5; --seq-650: #104281;
      --status-good:     #0ca30c;
      --status-warning:  #fab219;
      --status-serious:  #ec835a;
      --status-critical: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface:        #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --seq-450: #3987e5; --seq-650: #104281;
    --status-critical: #e66767;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 18px;
    line-height: 1.5;
    padding: 32px 24px 80px;
    max-width: 980px;
    margin: 0 auto;
  }

  header { margin-bottom: 32px; }
  h1 { font-size: 30px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-secondary); font-size: 16px; max-width: 70ch; }
  .status-line {
    margin-top: 14px; font-size: 14px; color: var(--text-muted);
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--text-muted); }
  .dot.ok { background: var(--status-good); }
  .dot.err { background: var(--status-critical); }

  section h2 {
    font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); margin: 40px 0 16px; font-weight: 600;
  }

  .gap-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 20px;
  }
  .gap-head { display: flex; gap: 18px; align-items: flex-start; }
  .rank {
    font-size: 34px; font-weight: 800; color: var(--text-muted);
    min-width: 56px; line-height: 1;
  }
  .gap-body { flex: 1; min-width: 0; }
  .need { font-size: 21px; font-weight: 600; margin: 0 0 12px; }

  .meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 4px; }

  .verdict-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 5px 12px; border-radius: 999px; color: #1a1a19; white-space: nowrap;
  }
  .verdict-tag .swatch { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .verdict-IGNORED          { background: var(--status-critical); color: #ffffff; }
  .verdict-UNDER-PRIORITIZED{ background: var(--status-warning);  color: #1a1a19; }
  .verdict-MISUNDERSTOOD    { background: var(--status-serious);  color: #1a1a19; }

  .confidence-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 180px; }
  .confidence-track {
    flex: 1; height: 10px; border-radius: 6px; background: var(--gridline); overflow: hidden;
  }
  .confidence-fill { height: 100%; background: var(--seq-450); border-radius: 6px; }
  .confidence-num { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.2ch; }

  details { margin-top: 16px; }
  summary {
    cursor: pointer; font-size: 14px; font-weight: 600; color: var(--seq-450);
    padding: 4px 0; user-select: none;
  }
  summary:hover { text-decoration: underline; }
  .detail-body { margin-top: 14px; }

  .block-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 16px 0 6px; font-weight: 700; }
  .block-label:first-child { margin-top: 0; }

  .math-block {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; line-height: 1.6; color: var(--text-secondary);
    background: var(--page); border: 1px solid var(--gridline); border-radius: 8px;
    padding: 12px 14px; white-space: pre-wrap; word-break: break-word;
  }

  .evidence-item, .ref-item {
    padding: 10px 0; border-top: 1px solid var(--gridline); font-size: 15px;
  }
  .evidence-item:first-child, .ref-item:first-child { border-top: none; }
  .ev-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .weight-badge {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 1px 7px; border-radius: 5px; margin-right: 8px; color: var(--text-primary);
    border: 1px solid var(--gridline);
  }
  .weight-primary { border-color: var(--seq-450); color: var(--seq-450); }
  .ev-text { color: var(--text-secondary); margin-top: 4px; }
  a.ev-link { color: var(--seq-450); text-decoration: none; }
  a.ev-link:hover { text-decoration: underline; }

  .alt-explanation { font-size: 15px; color: var(--text-secondary); font-style: italic; margin-top: 4px; }

  .rejected-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 22px; margin-bottom: 14px;
  }
  .rejected-card h3 { font-size: 17px; margin: 0 0 8px; }
  .rejected-reason { font-size: 15px; color: var(--text-secondary); }
  .rejected-ids { margin-top: 8px; font-size: 12px; color: var(--text-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .error-banner {
    background: var(--status-critical); color: #fff; padding: 14px 18px; border-radius: 10px;
    font-size: 15px; margin-bottom: 20px;
  }
  .loading { color: var(--text-muted); font-size: 15px; }
</style>
</head>
<body>

<header>
  <h1>The Silent Stakeholder — Bluesky Gap Analysis</h1>
  <div class="subtitle">8,359 Google Play reviews cross-checked against the live bluesky-social/social-app GitHub issue tracker. Ranked strongest evidence first.</div>
  <div class="status-line"><span class="dot" id="status-dot"></span><span id="status-text">Checking API…</span></div>
</header>

<div id="error-slot"></div>

<section>
  <h2>Gaps</h2>
  <div id="gaps-list"><div class="loading">Loading…</div></div>
</section>

<section>
  <h2>Rejected candidates — falsification log</h2>
  <div id="rejected-list"><div class="loading">Loading…</div></div>
</section>

<script>
const API_BASE = "http://localhost:8000";
const REPO_URL = "https://github.com/bluesky-social/social-app";

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function evidenceLink(id) {
  const m = id.match(/^github-issue-(\d+)$/);
  if (m) return `${REPO_URL}/issues/${m[1]}`;
  const ms = id.match(/^github-milestone-(\d+)$/);
  if (ms) return `${REPO_URL}/milestone/${ms[1]}`;
  return null;
}

function renderEvidence(evidence) {
  return evidence.map(e => {
    const link = evidenceLink(e.id);
    const idHtml = link
      ? `<a class="ev-link" href="${link}" target="_blank" rel="noopener">${escapeHtml(e.id)}</a>`
      : `<span class="ev-id">${escapeHtml(e.id)}</span>`;
    const weightClass = e.weight === "primary" ? "weight-primary" : "";
    return `
      <div class="evidence-item">
        <span class="weight-badge ${weightClass}">${escapeHtml(e.weight)}</span>${idHtml}
        <div class="ev-text">${escapeHtml(e.excerpt_or_paraphrase)}</div>
      </div>`;
  }).join("");
}

function renderRefs(refs) {
  return refs.map(r => {
    const link = evidenceLink(r.id);
    const idHtml = link
      ? `<a class="ev-link" href="${link}" target="_blank" rel="noopener">${escapeHtml(r.id)}</a>`
      : `<span class="ev-id">${escapeHtml(r.id)}</span>`;
    return `<div class="ref-item">${idHtml} — ${escapeHtml(r.relation)}</div>`;
  }).join("");
}

function renderGap(gap) {
  const pct = Math.round(gap.confidence * 100);
  return `
    <div class="gap-card">
      <div class="gap-head">
        <div class="rank">#${gap.rank}</div>
        <div class="gap-body">
          <p class="need">${escapeHtml(gap.need)}</p>
          <div class="meta-row">
            <span class="verdict-tag verdict-${escapeHtml(gap.verdict)}">${escapeHtml(gap.verdict)}</span>
            <div class="confidence-wrap">
              <div class="confidence-track"><div class="confidence-fill" style="width:${pct}%"></div></div>
              <span class="confidence-num">${gap.confidence.toFixed(2)}</span>
            </div>
          </div>
          <details>
            <summary>Show evidence trace &amp; confidence math</summary>
            <div class="detail-body">
              <div class="block-label">Verdict basis</div>
              <div class="ev-text">${escapeHtml(gap.verdict_justification)}</div>

              <div class="block-label">Confidence math</div>
              <div class="math-block">${escapeHtml(gap.confidence_justification)}</div>

              <div class="block-label">Evidence</div>
              ${renderEvidence(gap.evidence)}

              <div class="block-label">Roadmap cross-references</div>
              ${renderRefs(gap.roadmap_refs)}

              <div class="block-label">Alternative explanations considered and rejected</div>
              <div class="alt-explanation">${escapeHtml(gap.rejected_alternative_explanations)}</div>
            </div>
          </details>
        </div>
      </div>
    </div>`;
}

function renderRejected(rec) {
  const ids = (rec.supporting_evidence_ids || []).join(", ");
  return `
    <div class="rejected-card">
      <h3>${escapeHtml(rec.need)}</h3>
      <div class="rejected-reason">${escapeHtml(rec.reason)}</div>
      ${ids ? `<div class="rejected-ids">evidence: ${escapeHtml(ids)}</div>` : ""}
    </div>`;
}

async function main() {
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  const errorSlot = document.getElementById("error-slot");

  try {
    const health = await fetch(`${API_BASE}/health`).then(r => r.json());
    statusDot.classList.add("ok");
    statusText.textContent = `API online — ${health.gaps_loaded} gaps, ${health.rejected_loaded} rejected candidates loaded`;
  } catch (e) {
    statusDot.classList.add("err");
    statusText.textContent = "API unreachable";
    errorSlot.innerHTML = `<div class="error-banner">Can't reach the API at ${API_BASE}. Start it with:
      <code>uvicorn backend.app:app --reload --port 8000</code></div>`;
    document.getElementById("gaps-list").innerHTML = "";
    document.getElementById("rejected-list").innerHTML = "";
    return;
  }

  try {
    const gaps = await fetch(`${API_BASE}/gaps`).then(r => r.json());
    document.getElementById("gaps-list").innerHTML = gaps.map(renderGap).join("");
  } catch (e) {
    document.getElementById("gaps-list").innerHTML = `<div class="error-banner">Failed to load /gaps: ${escapeHtml(e.message)}</div>`;
  }

  try {
    const rejected = await fetch(`${API_BASE}/rejected`).then(r => r.json());
    document.getElementById("rejected-list").innerHTML = rejected.map(renderRejected).join("");
  } catch (e) {
    document.getElementById("rejected-list").innerHTML = `<div class="error-banner">Failed to load /rejected: ${escapeHtml(e.message)}</div>`;
  }
}

main();
</script>
</body>
</html>
